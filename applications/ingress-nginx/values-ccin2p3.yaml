ingress-nginx:
  controller:
    images:
      registry: "registry.hub.docker.com/cnafsd/nginx-httpg-voms"
      tag: "v1.30.3-1.2.2"
    nodeSelector:
      kubernetes.io/hostname: "ccqserv202"

    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "qserv"
        effect: "NoSchedule"

    service:
      externalIPs:
        - 134.158.237.2
      type: NodePort
    admissionWebhooks:
      enabled: false
    extraArgs:
    # podLabels:
    #   hub.jupyter.org/network-access-proxy-http: "true"
      default-ssl-certificate: ingress-nginx/ingress-certificate

vaultCertificate:
  enabled: true
