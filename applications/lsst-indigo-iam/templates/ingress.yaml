{{- if .Values.ingress.enabled -}}
{{- $path := .Values.ingress.path | default "/" -}}
{{- $isSubPath := ne $path "/" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lsst-indigo-iam.fullname" . }}
  labels: {{- include "lsst-indigo-iam.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- if $isSubPath }}
    nginx.ingress.kubernetes.io/x-forwarded-prefix: {{ $path | quote }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^{{ $path }}(/|$)(.*) /$2 break;
    {{- end }}
spec:
  ingressClassName: "nginx"
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ $path | quote }}
            pathType: "Prefix"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
{{- end }}
