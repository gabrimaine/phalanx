{{- if .Values.ingress.enabled -}}
{{- $path := .Values.ingress.path -}}
{{- $isSubPath := ne $path "/" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lsst-indigo-iam.fullname" . }}
  labels: {{- include "lsst-indigo-iam.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- if $isSubPath }}
    nginx.ingress.kubernetes.io/rewrite-target: "/$1"
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
spec:
  ingressClassName: "nginx"
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          {{- if $isSubPath }}
          - path: {{ printf "%s/(.*)" $path | quote }}
            pathType: "ImplementationSpecific"
          {{- else }}
          - path: "/"
            pathType: "Prefix"
          {{- end }}
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
{{- end }}
