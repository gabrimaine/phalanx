{{- if .Values.ingress.enabled -}}
{{- $path := .Values.ingress.path | default "/" -}}
{{- $isSubPath := ne $path "/" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lsst-indigo-iam.fullname" . }}
  labels: {{- include "lsst-indigo-iam.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/iam$ /iam/ permanent;
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
    #  proxy_redirect ~^/(.*)$ /iam/$1;
    {{- if $isSubPath }}
    nginx.ingress.kubernetes.io/x-forwarded-prefix: {{ $path | quote }}
    {{- end }}
    # Rewrite location header redirects from "/" to "/iam/"
    nginx.ingress.kubernetes.io/proxy-redirect-from: "/"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "/iam/"
    # Optional: Scope the session cookies to the /iam path
    nginx.ingress.kubernetes.io/proxy-cookie-path: "/ /iam"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      secretName: tls-secret
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - path: "/login"
            pathType: "ImplementationSpecific"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
          - path: "/webjars/(.*)"
            pathType: "ImplementationSpecific"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
          - path: "/resources/(.*)"
            pathType: "ImplementationSpecific"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
          - path: {{ printf "%s(/|$)(.*)" $path | quote }}
            pathType: "ImplementationSpecific"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
{{- end }}
