{{- if .Values.ingress.enabled -}}
{{- $path := .Values.ingress.path | default "/" -}}
{{- $isSubPath := ne $path "/" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lsst-indigo-iam.fullname" . }}
  labels: {{- include "lsst-indigo-iam.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-set-headers: |
      X-Forwarded-Proto: https
      X-Forwarded-Port: 443
      X-Forwarded-Host: {{ .Values.ingress.host }}
      X-Forwarded-Prefix: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/forwarded-for: "true"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      secretName: tls-secret
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" $path | quote }}
            pathType: "Prefix"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
{{- end }}
