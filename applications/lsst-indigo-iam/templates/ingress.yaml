{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lsst-indigo-iam.fullname" . }}
  labels: {{- include "lsst-indigo-iam.labels" . | nindent 4 }}
spec:
  ingressClassName: "nginx"
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
{{- end }}
