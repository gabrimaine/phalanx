apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lsst-indigo-iam-assets
  namespace: lsst-indigo-iam
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
    - host:
        - {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
            path: /webjars/(.*)
            pathType: ImplementationSpecific
          - backend:
              service:
                name: {{ .Values.global.iam.serviceName }}
                port:
                  number: {{ .Values.container.port }}
            path: /resources/(.*)
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      secretName: tls-secret

