"keystore.jwks":
  description: >-
    JSON Web Key set used by Indigo IAM to sign and verify JWT token
    signatures.
"root-password":
  description: >-
    Root password for the MariaDB database.
  generate:
    type: password
"user-password":
  description: >-
    User password for the MariaDB database used by the Indigo IAM service.
  generate:
    type: password
"user":
  description: >-
    Username for the MariaDB database used by the Indigo IAM service.
  value: "lsst_iam"
"username":
  description: >-
    SMTP mail relay username for sending notification emails from Indigo IAM.
"password":
  description: >-
    SMTP mail relay password for sending notification emails from Indigo IAM.
"mail":
  description: >-
    Sender and admin email address for Indigo IAM notifications.
"clientId":
  description: >-
    OIDC client ID for connecting to the external OpenID Connect provider.
  if: oidc.enabled
"clientSecret":
  description: >-
    OIDC client secret for connecting to the external OpenID Connect provider.
  if: oidc.enabled
"tls-secret":
  description: >-
    ingress secret for TLS
  copy:
    application: ingress-nginx
    key: ingress-certificate
